<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ASTEROIDS">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ASTEROIDS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    position: relative;
    font-family: 'Courier New', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 20px;
    pointer-events: none;
  }
  .stat {
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #00ff41;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #00ff41;
    text-shadow: 0 0 12px #00ff41;
    pointer-events: none;
    z-index: 50;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px;
  }
  #overlay h1 { font-size: clamp(36px, 9vw, 60px); letter-spacing: 8px; margin-bottom: 16px; }
  #overlay p  { font-size: clamp(15px, 3.75vw, 19px); letter-spacing: 2px; opacity: 0.8; margin: 5px 0; }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #loot-feed {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%); text-align: center; pointer-events: none;
  }
  .loot-msg {
    color: #ffd700; font-family: 'Courier New', monospace; font-size: 12px;
    letter-spacing: 2px; text-shadow: 0 0 8px #ffd700;
    animation: fadeUp 1.5s forwards; margin: 2px 0; white-space: nowrap;
  }
  @keyframes fadeUp {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }
</style>
</head>
<body>
<canvas id="c" style="position:absolute;top:0;left:0;z-index:1;"></canvas>
<div id="ui" style="position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;">
  <span class="stat" id="score-display">SCORE: 0</span>
  <span class="stat" id="loot-display">LOOT: 0</span>
  <span class="stat" id="lives-display" style="display:flex;align-items:center;gap:2px;"></span>
</div>
<div id="overlay">
  <h1>ASTEROIDS</h1>
  <p style="margin-bottom:4px;opacity:0.4;font-size:11px;letter-spacing:3px;">v84</p>
  <p style="margin-bottom:12px;opacity:0.5">-- CLAVIER --</p>
  <p>&lt;- -&gt; : ROTATION &nbsp;|&nbsp; ^ : THRUST</p>
  <p style="margin-top:16px;margin-bottom:8px;opacity:0.5">-- MODE TACTILE --</p>
  <div style="display:flex;gap:10px;justify-content:center;margin-bottom:8px;">
    <button id="btn-mode-touch" onclick="window.setControlMode('touch')" style="
      font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;
      padding:10px 18px;border:1.5px solid #00ff41;color:#00ff41;
      background:#000;cursor:pointer;text-shadow:0 0 8px #00ff41;
      box-shadow:0 0 10px rgba(0,255,65,0.4);
    ">DEUX POUCES</button>
    <button id="btn-mode-joy" onclick="window.setControlMode('joystick')" style="
      font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;
      padding:10px 18px;border:1.5px solid #444;color:#444;
      background:#000;cursor:pointer;
    ">JOYSTICK</button>
  </div>
  <p id="ctrl-desc" style="font-size:13px;opacity:0.6;margin-bottom:4px">POUCE G: ROT | POUCE D: ROT | LES DEUX: THRUST</p>
  <p style="margin-top:4px;opacity:0.5">AUTOFIRE PERMANENT</p>
  <p class="blink" style="margin-top:20px">— TOUCHER L'ÉCRAN OU ESPACE —</p>
</div>
<div id="loot-feed"></div>

<!-- Bouton paramètres -->
<button id="btn-params" onclick="window.openParams()" style="
  position:absolute; bottom:24px; left:24px;
  width:52px; height:52px; border-radius:50%;
  background:#000; border:1.5px solid #00cc33; color:#00cc33;
  font-family:'Courier New',monospace; font-size:10px; letter-spacing:1px;
  cursor:pointer; text-shadow:0 0 8px #00cc33;
  box-shadow:0 0 10px rgba(0,255,65,0.3);
  display:none; z-index:10; touch-action:manipulation;
">⚙ CFG</button>

<!-- Overlay paramétrage -->
<div id="params-overlay" style="
  display:none; position:absolute; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.95); z-index:200; overflow-y:auto;
  font-family:'Courier New',monospace; color:#00cc33;
  padding:16px; box-sizing:border-box;
">
  <div style="max-width:400px;margin:auto;">
    <div style="font-size:24px;letter-spacing:6px;text-align:center;margin-bottom:16px;text-shadow:0 0 12px #00ff41">
      PARAMÈTRES
    </div>
    <div id="params-content"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;margin-bottom:16px;">
      <button onclick="window.applyParams()" style="
        font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;
        padding:10px 20px;border:1.5px solid #00ff41;color:#00ff41;
        background:#000;cursor:pointer;text-shadow:0 0 8px #00ff41;
        box-shadow:0 0 10px rgba(0,255,65,0.4);
      ">APPLIQUER</button>
      <button onclick="window.resetParams()" style="
        font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;
        padding:10px 20px;border:1.5px solid #ffd700;color:#ffd700;
        background:#000;cursor:pointer;
      ">RESET</button>
      <button onclick="window.closeParams()" style="
        font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;
        padding:10px 20px;border:1.5px solid #444;color:#444;
        background:#000;cursor:pointer;
      ">FERMER</button>
    </div>
  </div>
</div>
<button id="btn-shield" onclick="window.activateShield()" style="
  position:absolute; bottom:24px; left:calc(50% - 44px);
  width:68px; height:68px; border-radius:50%;
  background:#000; border:1.5px solid #00ccff; color:#00ccff;
  font-family:'Courier New',monospace; font-size:10px; letter-spacing:1px;
  cursor:pointer; text-shadow:0 0 8px #00ccff;
  box-shadow:0 0 10px rgba(0,204,255,0.3);
  display:none; z-index:10; touch-action:manipulation;
  line-height:1.3;
">BCLR</button>

<button id="btn-double" onclick="window.activateDouble()" style="
  position:absolute; bottom:24px; left:calc(50% + 44px);
  width:68px; height:68px; border-radius:50%;
  background:#000; border:1.5px solid #ffd700; color:#ffd700;
  font-family:'Courier New',monospace; font-size:10px; letter-spacing:1px;
  cursor:pointer; text-shadow:0 0 8px #ffd700;
  box-shadow:0 0 10px rgba(255,215,0,0.3);
  display:none; z-index:10; touch-action:manipulation;
  line-height:1.3;
">DBL<br><span id="btn-double-timer"></span></button>

  <script>
    // Plein écran au premier tap/click
    function requestFullscreen() {
      const el = document.documentElement;
      const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (rfs) rfs.call(el);
    }
    // iOS : pas d'API fullscreen, mais on force le viewport
    document.addEventListener('touchstart', function onFirst() {
      requestFullscreen();
      // Masquer la barre d'adresse sur iOS
      window.scrollTo(0, 1);
      document.removeEventListener('touchstart', onFirst);
    }, { once: true });
    document.addEventListener('click', function onFirstClick() {
      requestFullscreen();
      document.removeEventListener('click', onFirstClick);
    }, { once: true });
    // Relancer si on sort du fullscreen (ex: notification)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        setTimeout(requestFullscreen, 500);
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
